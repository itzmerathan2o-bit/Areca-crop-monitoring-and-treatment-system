<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1DB954" />
    <meta name="description" content="AgroSense AI - Smart Areca Crop Monitoring & Treatment System with real-time NPK sensor data, AI-powered treatment recommendations, and comprehensive reporting." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://agrosense.ai/" />
    <meta property="og:title" content="AgroSense AI - Areca Crop Monitoring System" />
    <meta property="og:description" content="IoT + AI based smart agriculture platform for Areca Nut plantations with NPK monitoring and treatment recommendations." />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://agrosense.ai/" />
    <meta property="twitter:title" content="AgroSense AI - Areca Crop Monitoring System" />
    <meta property="twitter:description" content="IoT + AI based smart agriculture platform for Areca Nut plantations." />
    <meta property="twitter:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&family=Segoe+UI:wght@400;500;600;700&display=swap" rel="stylesheet">

    <title>AgroSense AI - Areca Crop Monitoring</title>

    <style>
      /* Critical CSS for loading screen */
      body {
        margin: 0;
        font-family: 'Segoe UI', 'Roboto Mono', monospace;
        background-color: #1a1a1a;
        color: #ffffff;
      }

      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #1a1a1a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .loading-logo {
        font-size: 4rem;
        margin-bottom: 1rem;
        animation: pulse 2s infinite;
      }

      .loading-text {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }

      .loading-subtext {
        font-size: 0.875rem;
        color: #a0aec0;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loading-logo">🌱</div>
      <div class="loading-text">AgroSense AI</div>
      <div class="loading-subtext">Loading your smart agriculture dashboard...</div>
    </div>

    <!-- React App Root -->
    <div id="root"></div>

    <script>
      // Hide loading screen when app loads
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.style.opacity = '0';
            loadingScreen.style.transition = 'opacity 0.5s ease-out';
            setTimeout(function() {
              loadingScreen.classList.add('hidden');
            }, 500);
          }
        }, 1000);
      });

      // Service Worker Registration (for PWA support)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('SW registered: ', registration);
            })
            .catch(function(registrationError) {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
